[project]
name = "agriculture-gpt"
version = "0.1.0"
description = "RAG and QLoRA-based agricultural advisory platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2,<3",
  "httpx>=0.27,<0.28",
  "chromadb>=0.5,<2",
  "sentence-transformers>=3,<6",
  "transformers>=4.45,<5",
  "tiktoken>=0.7,<1",
  "motor>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=0.24,<1",
]
training = [
  "bitsandbytes>=0.44",
  "peft>=0.13",
  "accelerate>=1.0",
  "datasets>=3",
  "trl>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.setuptools.packages.find]
include = ["app*"]

